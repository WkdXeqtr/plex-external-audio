# Builds the installer and publishes it as a release.
#
# Triggered by pushing a tag: git tag v1.0.1 && git push origin v1.0.1. The tag
# is the single source of the version number - it is stamped into all four
# binaries and into the installer, so a downloaded build can always say which
# tag it came from.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, for example v1.0.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}'
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "building $v"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build binaries and installer
        shell: pwsh
        run: |
          ./setup/build.ps1 -Installer `
            -Version '${{ steps.version.outputs.version }}' `
            -Iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'

      - name: Guard regression suite
        run: python guardtest/run.py

      # A checksum is the only thing a downloader can check on an unsigned
      # build, so it is worth publishing next to the installer.
      #
      # Named after the file it belongs to rather than SHA256SUMS: there is only
      # ever one artifact here, so a list is pointless, and the name then says
      # by itself what it is a checksum of.
      - name: Checksum
        id: checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer/Output/*.exe | Select-Object -First 1
          $h = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash
          $sums = Join-Path $exe.DirectoryName ($exe.Name + '.sha256')
          "$h  $($exe.Name)" | Out-File -Encoding ascii $sums
          "hash=$h"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "$h  $($exe.Name)"

      # The notes live in a file rather than inline. A PowerShell here-string
      # cannot be used here at all: its closing "@ has to sit in column zero,
      # and column zero is exactly what ends a YAML block scalar, so the two
      # requirements contradict each other and the workflow will not parse.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          # The checksum also goes into the notes, so it can be compared against
          # Get-FileHash without downloading a second file for one line of text.
          $lines = @(
            (Get-Content .github/release-notes.md -Raw).TrimEnd(),
            '',
            '## Checksum',
            '',
            ('SHA-256 of ' + '${{ steps.checksum.outputs.name }}' + ':'),
            '',
            ('    ' + '${{ steps.checksum.outputs.hash }}')
          )
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          ($lines -join "`n") | Out-File -Encoding utf8 $notes
          gh release create $v `
            (Get-ChildItem installer/Output/*.exe).FullName `
            (Get-ChildItem installer/Output/*.sha256).FullName `
            --title "Plex External Audio $v" `
            --notes-file $notes
